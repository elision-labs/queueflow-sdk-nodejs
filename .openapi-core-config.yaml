# Generates the low-level core only (models + per-tag APIs + fetch runtime).
# The ergonomic facade in src/ is hand-written on top and never regenerated.
generatorName: typescript-fetch
additionalProperties:
  npmName: "@queueflow/core"
  npmVersion: 0.1.0
  supportsES6: true
  withInterfaces: true
  typescriptThreePlus: true
  modelPropertyNaming: original
  hideGenerationTimestamp: true
# Keeps the regenerated core/package.json repository URL pointing at this repo
# (without these the generator emits GIT_USER_ID/GIT_REPO_ID placeholders).
gitUserId: elision-labs
gitRepoId: queueflow-sdk-nodejs
