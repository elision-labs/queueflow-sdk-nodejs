name: Release

# Publish @queueflow/sdk to npm when a v* tag is pushed.
#
# Auth is npm Trusted Publishing: this repo and workflow are registered as a
# trusted publisher for @queueflow/sdk on npmjs.com, and the id-token
# permission lets npm exchange GitHub's OIDC token for a short-lived publish
# credential. No NPM_TOKEN secret is used (a token would take precedence and
# bypass the trusted-publisher flow). Trusted publishing needs npm >= 11.5.1,
# hence the explicit npm upgrade; setup-node's registry-url is deliberately
# not set, since it writes an _authToken line that expects a token env var.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g npm@latest && npm --version
      - name: Verify the tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v${v}" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != package.json version ${v}" >&2; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public --provenance
